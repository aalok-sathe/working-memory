[project]
name = "workingmem"
version = "0.1.1"
description = "Investigating the nature of working memory limitations using computational modeling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dacite>=1.9.2",
    "einops>=0.8.1",
    "matplotlib>=3.10.1",
    "nnsight>=0.4.8",
    "numpy>=2.0.2",
    "plotly>=6.7.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.2",
    "submitit>=1.5.2",
    "torch>2.10",
    "transformer-lens>=2.11.0",
    "transformers>=4.48.3",
    "tyro>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12"]
build-backend = "uv_build"

[project.scripts]
swim = "workingmem.cli:entrypoint"
workingmem = "workingmem.cli:entrypoint"

[dependency-groups]
dev = [
    "anywidget>=0.9.16",
    "ipykernel>=6.29.5",
    "ipython>=8.33.0",
    "jupyter>=1.1.1",
    "marimo>=0.24.2",
    "pandas>=2.3.3",
    "pdoc>=15.0.1",
    "plotly[express]>=6.0.1",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[tool.setuptools]
packages = ['workingmem']

[tool.setuptools.package-dir]
"" = "workingmem"

[tool.ruff]
# line-length = 90

[tool.uv.sources]
workingmem = { path = "workingmem" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
